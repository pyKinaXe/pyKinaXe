paths:
  default_enrichment_file: data/external/PamGene/enrichment_peptides.csv

init_defaults:
  radius: 265.0
  smooth_sigma: 5.0
  horizontal_y1: 50
  horizontal_y2: 32
  horizontal_y3: 14
  horizontal_y4: 470
  horizontal_y5: 488
  horizontal_y6: 506
  vertical_x1: 110
  vertical_x2: 92
  vertical_x3: 74
  vertical_x4: 590
  vertical_x5: 608
  vertical_x6: 626
  edge_band_half_width: 6
  edge_padding: 50
  use_constrained_search: true
  gamma: 1.8
  median_kernel_size: 30
  canny_low_threshold: 0.04
  canny_high_threshold: 0.12
  # Circular-aperture detection mode:
  #   'calibrated' -> legacy constrained band/Canny search. Assumes a roughly
  #                   centered aperture; fails if the disc is shifted more than a
  #                   few tens of px from the calibrated position.
  #   'global'     -> content-driven detection (threshold -> largest bright blob
  #                   -> centroid + measured radius). No positional prior, so it
  #                   follows the aperture wherever it is. Automatically falls
  #                   back to 'calibrated' if the global estimate fails validation.
  detection_mode: global
  # Detect the aperture once per run on a robust median projection over frames and
  # reuse it for every frame (cheaper and more robust). Set false to estimate the
  # aperture INDEPENDENTLY FOR EACH IMAGE (same detection method, applied per frame;
  # noisier, especially for low-contrast frames, but follows any per-frame drift).
  detect_once: false
  # Measure the aperture radius from the image instead of using the fixed radius.
  estimate_radius: true
  # Validation gate for a global detection: min fraction of the fitted circle the
  # detected blob must fill (circularity check) and max allowed deviation of the
  # measured radius from the calibrated radius (as a fraction).
  aperture_min_fill: 0.80
  aperture_radius_tol: 0.35
  # Sub-pixel refinement of the global estimate by fitting a circle to the visible
  # rim (radial bright->dark edge search seeded by the coarse circle). Corrects the
  # centroid/area bias when the disc is clipped by an image edge. Falls back to the
  # coarse estimate if the rim fit fails its validation gate.
  refine_aperture: true
  # Number of radial rays cast from the coarse center when fitting the aperture rim.
  # More rays = denser rim sampling (slower); 180 is ample to fit a circle robustly.
  aperture_refine_n_rays: 180
  # Fix the mask RADIUS (reference px, scaled by scale_factor at runtime) instead of
  # estimating it per run, so every PTK/STK image uses the same radius. Set to the
  # average measured aperture radius across PTK and STK runs. The detected/refined
  # CENTER is still used per run; only the radius is pinned. null => estimate per run.
  fixed_aperture_radius: 279.25
  # Shrink the final mask radius by this many (reference) px to stay inside the soft
  # rim / vignetting and avoid edge effects. Applied to fixed and estimated radii.
  radius_edge_margin_px: 5.0
  # Online outlier rejection for per-image aperture centers (only when detect_once
  # is false). Images are processed in order; the running median & std of the
  # accepted centers of already-processed images are tracked. If the current
  # image's detected center deviates from the running median by more than
  # center_outlier_n_std * std (in x OR y), it is replaced with the running median.
  # Activates only after center_outlier_min_samples prior centers exist.
  center_outlier_rejection: true
  center_outlier_n_std: 20.0
  center_outlier_min_samples: 5

  # --- Background subtraction (morphological grey-opening) structuring elements ---
  # All SE sizes are in reference px and scaled by scale_factor at runtime.
  #   Stage 1: base opening, removes small features.
  #   Stage 2: opening of the stage-1 background with a larger SE
  #            (= stage1 * background_stage2_se_multiplier, computed on a
  #             downsampled image). Not an independent size, it scales with stage 1.
  #   Stage 3: a much larger opening of the stage-2 background that erases large /
  #            saturated spots so the background under them is estimated correctly.
  #            Set background_enable_third_stage: false to skip it.
  background_structuring_element_size: 50
  background_stage2_se_multiplier: 1.5
  background_enable_third_stage: true
  background_stage3_structuring_element_size: 100
  # Downsample factor for the stage-2/3 openings (stage 1 stays full-resolution).
  # These stages are not the bottleneck (stage 1 + per-frame prep dominate), so
  # 4 gave almost no speedup; keeping 2 for full stage-3 fidelity near saturated
  # regions. Raise it only if stages 2/3 ever become significant.
  background_downsample_factor: 2

  # --- Background METHOD --------------------------------------------------
  # How each spot's background is removed:
  #   morphological : the 3-stage grey-opening above, subtracted from the whole
  #                   image up front; localization AND intensities use it. Default.
  #   disc          : localization is UNCHANGED (still on the morphological-
  #                   subtracted image); only the FINAL spot intensities are
  #                   recomputed from the RAW images, each spot's background being
  #                   the MEDIAN of the raw pixels in an annulus (ring) around it,
  #                   subtracted before the median/integrated intensities form.
  #                   Set back to morphological to fall back.
  #   mgo_median    : like 'disc' (aperture measured on RAW, localization
  #                   unchanged), but each spot's background is the MEDIAN of the
  #                   MORPHOLOGICAL grey-opening STAGE-3 background in a disc
  #                   (background_mgo_median_radius) around the spot centre. The
  #                   stage-3 background is spot-free, so the disc may cover the
  #                   spot itself (no ring needed). Combines MGO's saturation-
  #                   aware background estimate with a raw, end-stage measurement.
  #   mgo_disc_avg  : per-spot background = AVERAGE of the 'mgo_median' background
  #                   (MGO stage-3 disc median) and the 'disc' background (raw-
  #                   annulus median). Uses both background_mgo_median_radius and
  #                   the disc annulus geometry below.
  background_method: mgo_disc_avg
  # disc-method annulus geometry, in reference px (scaled like integration_radius).
  # Sweep-optimal (best BN correlation): aperture 6, inner 9 (gap 3), width 3 ->
  # ring 9-12 px, giving CCC ~0.999 and median ratio ~1.00. The ring must sit in
  # the gaps BETWEEN spots: with ~21.5 px spacing and a ~6 px aperture, keep outer
  # (= inner + width) below ~half the spacing so it never reaches a neighbour.
  # (inner - aperture) is the GAP that skips the spot's signal tail.
  # Disc-mode aperture radius (reference px), independent of integration_radius.
  # In disc mode the whole pipeline (localization + measurement) uses this.
  background_disc_aperture_radius: 6.0
  background_disc_inner_radius: 9.0
  background_disc_width: 3.0
  # mgo_median / mgo_disc_avg geometry: radius (reference px) of the disc around
  # each spot over which the MGO stage-3 background MEDIAN is taken as that spot's
  # background. "Twice larger in diameter" than the aperture -> 2x the aperture
  # radius (6). Used by background_method: mgo_median and mgo_disc_avg.
  background_mgo_median_radius: 12.0

# ---------------------------------------------------------------------------
# Tunable parameters for the main processing methods. These mirror the default
# arguments of the corresponding ImageProcessor methods; a method still accepts
# explicit overrides, but when a parameter is left unset it falls back to the
# value here. Pixel-valued entries are scaled by scale_factor at runtime where
# the method already scales them.
# ---------------------------------------------------------------------------

# detect_reference_spots()
reference_spot_detection:
  pre_smooth_sigma: 5.0
  min_peak_distance: 10
  intensity_threshold_percentile: 80
  spot_edge_padding: 5
  edge_search_width: 115.0
  spacing_tolerance: 10.0
  median_filter_size: 15
  use_simple_strategy: true
  constrain_search_to_mask: true
  # Hybrid fallback: if the (fast) simple strategy fails to find BOTH the T and J
  # reference shapes for a frame, retry that frame on a median-filtered image
  # (size median_filter_size) which removes dust specks, using the SAME left/right
  # half-split matching. Only accepted if the filtered retry recovers a full,
  # geometry-validated T-J pair; otherwise the simple result is kept.
  median_fallback: true

# refine_reference_spot_positions()  (wiggle_radius is the value the pipeline
# actually uses via process(); integration_radius comes from spot_intensity)
reference_spot_refinement:
  wiggle_radius: 2.0
  angle_threshold_deg: 2.0

# compute_spot_intensities() / compute_refined_spot_intensities() / shared radius
spot_intensity:
  # Aperture RADIUS (reference px) for MORPHOLOGICAL mode -- used for both
  # spot-position refinement (detection) and intensity estimation. Disc mode has
  # its OWN aperture (background_disc_aperture_radius), so this value only affects
  # morphological runs.
  integration_radius: 5.0

# refine_grid_parameters()  (integration_radius comes from spot_intensity)
grid_refinement:
  position_range: 4.0
  angle_range_deg: 2.0
  spacing_range: 0.3
  # Extra 5th optimization variable: rotation of the whole square mask / grid about
  # its center (deg), on top of angle_range_deg. Lets the optimizer correct a
  # reference-derived box orientation that is off by more than angle_range_deg
  # (total angular search becomes +/-(angle_range_deg + box_angle_range_deg)).
  box_angle_range_deg: 2.0
  method: L-BFGS-B
  n_rounds: 1
  individual_spot_refinement: true
  individual_refinement_range: 2.0

# visualize_processing_stages(): which per-image processing-stage QC figures to
# render. Each flag maps to one visualize_* method; disabled stages are skipped.
processing_stage_figures:
  background_subtraction: false       # visualize_background_subtraction
  circular_mask_detection: false     # visualize_circular_mask_detection
  grid_refinement: false              # visualize_grid_refinement
  reference_spots: true             # visualize_refined_reference_spots
  square_mask: false                 # visualize_square_mask
