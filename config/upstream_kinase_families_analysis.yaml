# Config for the kinase-FAMILY upstream analysis (kx_upstream_kinase_families_analysis.py).
# Mirrors the single-kinase `upstream_kinase_analysis` block in analysis_modules.yaml,
# but scores at the ptm_enzyme_family level and uses a higher Z-score significance
# threshold. Change `default_kpea_zscore_threshold` here to tune family significance.
upstream_kinase_families_analysis:
  default_verified_evidence_levels:
    - curated_literature
    - curated_source
    - literature_supported
  default_blast_results_relative_path: external/BLAST/blast_results_uniprot.csv
  uniprot_name_lookup_url: https://rest.uniprot.org/uniprotkb/search
  path_file_enrichment_peptides: data/external/PamGene/enrichment_peptides.csv
  input_stk_ptm_path: data/external/processed/PTM_Data_OmniPath/stk_interactions.csv
  input_ptk_ptm_path: data/external/processed/PTM_Data_OmniPath/ptk_interactions.csv
  candidate_data_paths:
    - ./data
    - ../data
    - ../../data
    - ~/data
  allowed_kpea_background_universes:
    - chip
    - measured
  allowed_kpea_cutoff_modes:
    - average
    - primary
  default_kpea_lfc_cutoffs: [0.2, 0.3, 0.4]
  default_kpea_cutoff_mode: average
  default_kpea_substrate_cutoff: 0
  # Family-level threshold: KRSA's own |Z| >= 2 hit convention (run_krsa.R:
  # z_hit_threshold). The threshold only moves the calling line, not the
  # z-scores. The single-kinase UKA uses a lower threshold (1.3, in
  # pipeline_defaults.yaml) because a single kinase has fewer substrates.
  default_kpea_zscore_threshold: 2.0
  default_kpea_z_cap: 10.0
  # KRSA samples its null from the whole mapping table, so 'chip' is what makes
  # the z-scores comparable. 'measured' restricts the population to measured,
  # QC-passed peptides.
  default_kpea_background_universe: chip
  # Source of the peptide -> kinase-family mapping used for scoring:
  #   krsa    = KRSA's curated peptide->family tables (default; most KRSA-comparable)
  #   uniprot = families derived from ptm_enzyme_family (BLAST + PTM + UniProt)
  family_mapping_source: krsa
  allowed_family_mapping_sources:
    - krsa
    - uniprot
  # KRSA curated mapping files (Substrates, space-separated family list). Chip-specific:
  # PamChip 86402 (PTK) / 87102 (STK).
  krsa_ptk_mapping_path: data/external/KRSA/KRSA_Mapping_PTK_PamChip_86402_v1.csv
  krsa_stk_mapping_path: data/external/KRSA/KRSA_Mapping_STK_PamChip_87102_v1.csv
