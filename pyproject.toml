[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DigitalVirology"
version = "0.1.0"
requires-python = ">=3.11"
# Core scientific/runtime dependencies used by the terminal analysis workflow.
dependencies = [
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "inmoose>=0.9.1",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numba>=0.59",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "openpyxl>=3.1",
    "pandas>=2.1",
    "requests>=2.31",
    "scipy>=1.11",
    "seaborn>=0.13",
    "xarray>=2023.0",
]

[project.optional-dependencies]
# Web backend extras. The browser frontend itself is static and is not
# installed here; this extra covers the Flask/Gunicorn server side only.
web = [
    "Flask>=3.0",
    "gunicorn>=21.2",
]
# Development tooling. Not needed to run the pipeline: the test suites are plain
# assert scripts that run under a bare `python`, and pytest only adds collection
# and reporting on top of them.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["config"]
# Every module in src/ must be listed: package-dir maps "" -> src, and src/ is
# not installed as a package, so a module missing here is silently absent from a
# `pip install .` even though it exists in a git checkout.
py-modules = [
    "kx_benchmarking",
    "kx_data_enricher",
    "kx_data_importer",
    "kx_image_processor",
    "kx_pathway_enrichment_analysis",
    "kx_peptide_analysis",
    "kx_peptide_ids",
    "kx_peptide_spot_report",
    "kx_pipeline_tools",
    "kx_plot_results",
    "kx_upstream_kinase_analysis",
    "kx_upstream_kinase_families_analysis",
]

[tool.setuptools.package-data]
config = ["*.yaml"]

[tool.setuptools.package-dir]
"" = "src"
config = "config"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["cache", "notebooks", "results"]

[tool.ruff.lint]
# Narrow selection: this is a scientific codebase with long, comment-heavy
# functions and NumPy-style naming, so the goal is to keep the tree free of dead
# code and real errors, not to enforce a style. F = pyflakes (the checks the
# codebase is already clean against), E9 = syntax/IO errors, B = likely bugs.
select = ["F", "E4", "E7", "E9", "B"]
# Each exclusion below was checked against the actual findings rather than
# switched off to make the gate pass. What stays enabled is the part that catches
# real defects: F (pyflakes -- dead code, undefined names, unused imports), E9
# (syntax/IO errors), and the B rules not listed here (mutable default
# arguments, `assert` on a tuple, mutable class attributes, ...).
ignore = [
    # The entry-point modules bootstrap sys.path so the repository is
    # importable before the shared pipeline code is pulled in.
    "E402",
    # Pure formatting, and this codebase predates any formatter.
    "E701",
    "E702",
    # Cosmetic: an unpacked-but-unused loop variable documents the tuple shape.
    "B007",
    # Verified false positive at kx_image_processor.py:5172 -- the closure is
    # handed to scipy.minimize synchronously inside the same iteration, so it
    # never outlives the loop variables it reads.
    "B023",
    # `raise ... from err` inside except: worth doing, not worth churning the
    # tree for a single site.
    "B904",
    # zip(..., strict=) would be a genuine improvement (13 sites) but changes
    # runtime behaviour on length mismatch, so it needs its own reviewed change
    # rather than a bulk edit.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Tests use plain asserts (see the module docstrings).
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Only the unit-test modules; compare_pykinaxe_krsa.py is a manual comparison
# script that needs a full analysis run and its KRSA reference outputs.
python_files = ["test_*.py"]
