[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DigitalVirology"
version = "0.1.0"
requires-python = ">=3.11"
# Core scientific/runtime dependencies used by the terminal analysis workflow.
dependencies = [
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "gprofiler-official>=1.0",
    "inmoose>=0.9.1",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numba>=0.59",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "openpyxl>=3.1",
    "pandas>=2.1",
    "requests>=2.31",
    "scipy>=1.11",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "xarray>=2023.0",
]

[project.optional-dependencies]
# Web backend extras. The browser frontend itself is static and is not
# installed here; this extra covers the Flask/Gunicorn server side only.
web = [
    "Flask>=3.0",
    "gunicorn>=21.2",
]

[tool.setuptools]
packages = ["config"]
py-modules = [
    "kx_benchmarking",
    "kx_data_enricher",
    "kx_data_importer",
    "kx_image_processor",
    "kx_pathway_enrichment_analysis",
    "kx_peptide_analysis",
    "kx_pipeline_tools",
    "kx_plot_results",
    "kx_upstream_kinase_analysis",
]

[tool.setuptools.package-data]
config = ["*.yaml"]

[tool.setuptools.package-dir]
"" = "src"
config = "config"
